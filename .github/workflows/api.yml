name: API

on:
  push:
    branches:
      - main
    paths:
      - "API/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: API

jobs:
  validate-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: API/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-dist-${{ github.sha }}
          path: API/dist
          if-no-files-found: error

      - name: Trigger Render deployment
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          test -n "$RENDER_DEPLOY_HOOK_URL"
          test -n "$API_BASE_URL"
          case "$API_BASE_URL" in
            http://*|https://*) ;;
            *) echo "API_BASE_URL debe comenzar con http:// o https://" >&2; exit 1 ;;
          esac

          curl --silent --show-error --fail \
            --request POST \
            --url "${RENDER_DEPLOY_HOOK_URL}&ref=${DEPLOY_COMMIT}" \
            --output /dev/null

      - name: Verify deployed commit
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          for attempt in $(seq 1 30); do
            response="$(curl --silent --show-error --fail \
              --max-time 10 \
              "${API_BASE_URL%/}/health" || true)"
            if node -e '
              const response = JSON.parse(process.argv[1]);
              process.exit(response.commit === process.argv[2] ? 0 : 1);
            ' "$response" "$DEPLOY_COMMIT"; then
              exit 0
            fi
            sleep 10
          done
          echo "El servicio no informó el commit desplegado esperado." >&2
          exit 1
