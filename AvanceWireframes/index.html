  const blockHeights = { chrome:34, 'media-lg':176, media:112, signature:38, progress:32, metric:48, status:48, field:38, toggle:30, button:36, alert:56, 'social-row':42, metrics:76, card:72, nav:42, list:126, filter:36, bars:110, achievements:132, grid4:142, grid3:124, grid2:104, table:146, slider:42, controls:92, scene:260, overlay:166, steps:132, text:70, sync:54, timer:60, 'game-hud':54, legend:58 };
